spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 30000
  jpa:
    properties:
      hibernate.default_schema: interior_cms
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/supabase
    default-schema: interior_cms
    schemas: interior_cms
    create-schemas: true
    clean-disabled: true
