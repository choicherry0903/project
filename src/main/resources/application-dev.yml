# Local development only: run from the project root with demo,dev or supabase,dev.
# IntelliJ auto-build copies YAML/classes; DevTools then restarts the context.
spring:
  thymeleaf:
    cache: false
    prefix: file:./src/main/resources/templates/
  web:
    resources:
      static-locations:
        - file:./src/main/resources/static/
        - classpath:/static/
      cache:
        period: 0
      chain:
        cache: false
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
    livereload:
      enabled: true
---
# Keep the in-memory demo data when DevTools rebuilds the application context.
spring:
  config:
    activate:
      on-profile: demo
  jpa:
    hibernate:
      ddl-auto: update
