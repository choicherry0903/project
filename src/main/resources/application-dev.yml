spring:
  thymeleaf:
    cache: false
    prefix: file:./src/main/resources/templates/
  web:
    resources:
      static-locations:
        - file:./src/main/resources/static/
        - classpath:/static/
      cache:
        period: 0
      chain:
        cache: false
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
