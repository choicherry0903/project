<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('견적 관리', ~{::main})}">
<main>
  <div class="page-heading"><div><p class="eyebrow">EST-01 · ESTIMATES</p><h1>견적 관리</h1><p class="muted">현장별 견적과 초안 금액을 확인하세요.</p></div>
    <a class="button" th:href="@{/estimates/new(projectId=${projectId})}">＋ 견적 등록</a></div>
  <section class="panel">
    <form class="search-bar" th:action="@{/estimates}" method="get">
      <input th:if="${projectId != null}" type="hidden" name="projectId" th:value="${projectId}">
      <label class="sr-only" for="keyword">현장명 검색</label><input id="keyword" name="keyword" th:value="${keyword}" placeholder="현장명 검색">
      <label class="sr-only" for="status">견적 상태</label><select id="status" name="status"><option value="">전체 상태</option><option th:each="s : ${statuses}" th:value="${s}" th:selected="${s == selectedStatus}" th:text="${#messages.msg('estimate.status.' + s)}"></option></select>
      <button class="button">검색</button><a class="button secondary" th:href="@{/estimates(projectId=${projectId})}">초기화</a>
    </form>
    <div class="table-scroll"><table><thead><tr><th>현장 / 견적</th><th>상태</th><th>유효기한</th><th>총 견적</th><th>관리</th></tr></thead><tbody>
      <tr th:each="e : ${estimates.content}"><td><a th:href="@{/estimates/{id}(id=${e.id})}" th:text="${projectNames[e.projectId]} + ' · V' + ${e.revision}"></a><small class="muted block" th:text="'견적 #' + ${e.id}"></small></td>
      <td><span class="badge" th:text="${#messages.msg('estimate.status.' + e.status)}"></span></td><td th:text="${e.validUntil ?: '미정'}"></td><td th:text="${#numbers.formatInteger(e.totalAmount, 1, 'COMMA')} + '원'"></td>
      <td><a th:if="${e.status.name() == 'DRAFT'}" th:href="@{/estimates/{id}/edit(id=${e.id})}">수정</a></td></tr>
    </tbody></table></div>
    <div class="empty-state" th:if="${estimates.empty}"><h2>등록된 견적이 없습니다</h2><p>현장을 선택하고 첫 견적 초안을 작성해 보세요.</p><a class="button" th:href="@{/estimates/new(projectId=${projectId})}">견적 등록</a></div>
    <div class="pagination"><span th:text="'총 ' + ${estimates.totalElements} + '건 · ' + (${estimates.number} + 1) + '페이지'"></span><div>
      <a th:if="${estimates.hasPrevious()}" th:href="@{/estimates(projectId=${projectId},status=${selectedStatus},keyword=${keyword},page=${estimates.number-1})}">이전</a>
      <a th:if="${estimates.hasNext()}" th:href="@{/estimates(projectId=${projectId},status=${selectedStatus},keyword=${keyword},page=${estimates.number+1})}">다음</a></div></div>
  </section>
</main></html>
