<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('견적 삭제', ~{::main})}">
<main>
  <div class="page-heading"><div><p class="eyebrow">EST-01 · DELETE</p><h1>견적 삭제</h1></div></div>
  <section class="panel edit-form"><h2 th:text="${project.name} + ' · 견적 V' + ${estimate.revision}"></h2>
    <p th:text="'총 견적 금액 ' + ${#numbers.formatInteger(estimate.totalAmount, 1, 'COMMA')} + '원'"></p>
    <p>삭제하면 견적 목록에서 제외됩니다. 현장·자재 정보는 유지됩니다.</p>
    <form th:if="${estimate.status.name() == 'DRAFT'}" method="post" th:action="@{/estimates/{id}/delete(id=${estimate.id})}"><input type="hidden" name="version" th:value="${estimate.version}"><div class="form-actions"><a class="button secondary" th:href="@{/estimates/{id}(id=${estimate.id})}">취소</a><button type="submit" class="button">초안 삭제</button></div></form>
    <p th:unless="${estimate.status.name() == 'DRAFT'}">초안 견적만 삭제할 수 있습니다.</p>
  </section>
</main></html>
