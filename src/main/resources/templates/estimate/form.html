<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('견적 작성', ~{::main})}">
<main>
  <div class="page-heading"><div><p class="eyebrow">EST-01 · DRAFT</p><h1 th:text="${estimateId == null ? '견적 등록' : '견적 수정'}"></h1><p class="muted">자재와 시공 항목을 구성하고 견적 초안을 저장하세요.</p></div><span class="badge">초안</span></div>
  <form class="panel estimate-form" id="estimate-form" data-dirty-check method="post" th:object="${form}" th:action="${estimateId == null} ? @{/estimates} : @{/estimates/{id}(id=${estimateId})}">
    <div class="notice error" role="alert" tabindex="-1" th:if="${#fields.hasAnyErrors()}"><p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p></div>
    <input type="hidden" th:field="*{version}"><input type="hidden" th:field="*{requestKey}"><input type="hidden" name="displayedTotal" id="displayedTotal" value="">
    <div class="notice" th:if="${#lists.isEmpty(projects)}">견적을 작성하려면 <a th:href="@{/projects/new}">현장을 먼저 등록</a>해 주세요.</div>
    <h2>기본 정보</h2><div class="form-grid">
      <div><label for="projectId">현장 *</label><select id="projectId" th:field="*{projectId}" required th:disabled="${estimateId != null}"><option value="">현장 선택</option><option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name} + ' / ' + ${p.address}"></option></select><input th:if="${estimateId != null}" type="hidden" name="projectId" th:value="*{projectId}"></div>
      <div><label for="validUntil">견적 유효기한</label><input id="validUntil" type="date" th:field="*{validUntil}"></div>
      <div><label for="scopeOfWork">공사 범위</label><textarea id="scopeOfWork" th:field="*{scopeOfWork}" maxlength="2000" rows="3" placeholder="예: 거실·침실 벽지 교체, 천장 포함"></textarea></div>
      <div><label for="excludedWork">제외 공사·안내</label><textarea id="excludedWork" th:field="*{excludedWork}" maxlength="2000" rows="3" placeholder="예: 가구 이동, 전기 공사 제외"></textarea></div>
    </div>
    <div class="estimate-section-heading"><div><h2>견적 항목</h2><p class="muted">판매 단가를 입력하세요. 구매 원가와 작업자 일당은 별도 비용으로 관리합니다.</p></div><button type="button" class="button secondary" id="add-line">＋ 항목 추가</button></div>
    <div class="estimate-material-picker"><label for="material-choice">등록 자재에서 불러오기</label><select id="material-choice"><option value="">자재 선택</option><option th:each="m : ${materials}" th:value="${m.id}" th:text="${m.name} + (${m.size != null ? ' / ' + m.size : ''})" th:attr="data-name=${m.name},data-unit=${m.unit},data-price=${m.sellingPrice}"></option></select><button type="button" class="button secondary" id="add-material">자재 추가</button></div>
    <p class="muted">불러온 자재의 명칭·단위·판매 단가는 견적에 복사됩니다. 필요하면 직접 수정하세요.</p>
    <div class="table-scroll"><table class="estimate-items"><thead><tr><th>분류</th><th>항목명 / 무료 사유</th><th>수량</th><th>단위</th><th>판매 단가</th><th>금액</th><th>삭제</th></tr></thead><tbody id="estimate-lines">
      <tr th:each="item, s : *{items}">
        <td><select th:field="*{items[__${s.index}__].category}" aria-label="항목 분류"><option th:each="c : ${categories}" th:value="${c.key}" th:text="${c.value}"></option></select></td>
        <td><input th:field="*{items[__${s.index}__].name}" maxlength="200" placeholder="항목명" aria-label="항목명"><input th:field="*{items[__${s.index}__].freeItemReason}" maxlength="500" placeholder="무료 항목 사유 (선택)" aria-label="무료 항목 사유"></td>
        <td><input type="number" th:field="*{items[__${s.index}__].quantity}" min="0.01" max="999999.99" step="0.01" placeholder="수량" aria-label="수량"></td>
        <td><input th:field="*{items[__${s.index}__].unit}" maxlength="20" placeholder="롤, 인일, 식" aria-label="단위"></td>
        <td><input type="number" th:field="*{items[__${s.index}__].unitPrice}" min="0" max="999999999" step="1" placeholder="원" aria-label="판매 단가"></td>
        <td><output class="line-amount">—</output></td><td><button type="button" class="text-button remove-line" aria-label="견적 항목 삭제">삭제</button></td>
      </tr>
    </tbody></table></div>
    <p class="muted" id="draft-hint" aria-live="polite">미완성 항목도 초안으로 저장할 수 있습니다.</p>
    <div class="form-grid estimate-adjustments"><div><label for="discount">할인 금액 (원)</label><input type="number" id="discount" th:field="*{discount}" min="0" max="999999999" step="1" required></div><div><label for="taxRate">세율</label><select id="taxRate" name="taxRate"><option value="0.10" th:selected="${form.taxRate == 0.10}">10%</option><option value="0" th:selected="${form.taxRate == 0}">0%</option><option th:if="${form.taxRate != null && form.taxRate != 0 && form.taxRate != 0.10}" th:selected="${true}" th:value="${form.taxRate}" th:text="${form.taxRate * 100} + '%'"></option></select></div></div>
    <div class="estimate-totals" aria-live="polite"><div><span>항목 합계</span><strong id="subtotal">0원</strong></div><div><span>공급가액</span><strong id="supply">0원</strong></div><div><span>부가세</span><strong id="tax">0원</strong></div><div class="estimate-grand-total"><span>총 견적 금액</span><strong id="total">0원</strong></div></div>
    <p class="notice error" id="amount-error" hidden></p>
    <div class="form-actions"><a class="button secondary" th:href="@{/estimates(projectId=${form.projectId})}">목록</a><button class="button" type="submit" th:disabled="${#lists.isEmpty(projects)}">초안 저장</button></div>
  </form>
  <template id="line-template"><tr>
    <td><select data-field="category" aria-label="항목 분류"><option value="MATERIAL">자재</option><option value="LABOR">인건비</option><option value="DEMOLITION">철거</option><option value="TRANSPORT">운반</option><option value="OTHER">기타</option></select></td>
    <td><input data-field="name" maxlength="200" placeholder="항목명" aria-label="항목명"><input data-field="freeItemReason" maxlength="500" placeholder="무료 항목 사유 (선택)" aria-label="무료 항목 사유"></td>
    <td><input data-field="quantity" type="number" min="0.01" max="999999.99" step="0.01" placeholder="수량" aria-label="수량"></td><td><input data-field="unit" maxlength="20" placeholder="롤, 인일, 식" aria-label="단위"></td>
    <td><input data-field="unitPrice" type="number" min="0" max="999999999" step="1" placeholder="원" aria-label="판매 단가"></td><td><output class="line-amount">—</output></td><td><button type="button" class="text-button remove-line" aria-label="견적 항목 삭제">삭제</button></td>
  </tr></template>
  <script defer th:src="@{/js/estimate.js}"></script>
</main></html>
