<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('견적 상세', ~{::main})}">
<main>
  <div class="page-heading"><div><p class="eyebrow">EST-01 · ESTIMATE</p><h1 th:text="${project.name} + ' · 견적 V' + ${estimate.revision}"></h1><span class="badge" th:text="${#messages.msg('estimate.status.' + estimate.status)}"></span></div><a class="button" th:if="${estimate.status.name() == 'DRAFT'}" th:href="@{/estimates/{id}/edit(id=${estimate.id})}">견적 수정</a></div>
  <div class="notice error" role="alert" th:if="${error}" th:text="${error}"></div>
  <section class="panel"><h2>견적 기본정보</h2><dl class="details"><dt>현장</dt><dd><a th:href="@{/projects/{id}(id=${project.id})}" th:text="${project.name}"></a></dd><dt>유효기한</dt><dd th:text="${estimate.validUntil ?: '미정'}"></dd><dt>공사 범위</dt><dd class="preserve-lines" th:text="${estimate.scopeOfWork ?: '미입력'}"></dd><dt>제외 공사·안내</dt><dd class="preserve-lines" th:text="${estimate.excludedWork ?: '없음'}"></dd></dl></section>
  <section class="panel"><h2>견적 항목</h2><div class="table-scroll"><table><thead><tr><th>분류</th><th>항목명</th><th>수량</th><th>단위</th><th>판매 단가</th><th>금액</th></tr></thead><tbody>
    <tr th:each="i : ${items}"><td th:text="${categories[i.category] ?: i.category}"></td><td><span th:text="${i.name == '' ? '미입력' : i.name}"></span><small class="muted block" th:text="${i.freeItemReason}"></small></td><td th:text="${i.quantityMissing ? '미입력' : i.quantity}"></td><td th:text="${i.unit == '' ? '미입력' : i.unit}"></td><td th:text="${i.unitPriceMissing ? '미입력' : #numbers.formatInteger(i.unitPrice, 1, 'COMMA') + '원'}"></td><td th:text="${#numbers.formatInteger(i.amount, 1, 'COMMA')} + '원'"></td></tr>
  </tbody></table></div><p class="muted" th:if="${#lists.isEmpty(items)}">견적 항목을 추가해 주세요.</p>
  <div class="estimate-totals"><div><span>항목 합계</span><strong th:text="${#numbers.formatInteger(estimate.supplyAmount + estimate.discount, 1, 'COMMA')} + '원'"></strong></div><div><span>할인</span><strong th:text="${#numbers.formatInteger(estimate.discount, 1, 'COMMA')} + '원'"></strong></div><div><span>공급가액</span><strong th:text="${#numbers.formatInteger(estimate.supplyAmount, 1, 'COMMA')} + '원'"></strong></div><div><span th:text="'부가세 (' + ${estimate.taxRateLabel} + ')'"></span><strong th:text="${#numbers.formatInteger(estimate.taxAmount, 1, 'COMMA')} + '원'"></strong></div><div class="estimate-grand-total"><span>총 견적 금액</span><strong th:text="${#numbers.formatInteger(estimate.totalAmount, 1, 'COMMA')} + '원'"></strong></div></div>
  <p class="notice" th:if="${estimate.status.name() == 'DRAFT'}">초안입니다. 미완성 항목을 보완할 수 있으며, 견적 확정과 PDF 출력은 후속 기능입니다.</p>
  <div class="form-actions"><a class="button secondary" th:href="@{/estimates(projectId=${project.id})}">목록</a><a class="button secondary" th:if="${estimate.status.name() == 'DRAFT'}" th:href="@{/estimates/{id}/delete(id=${estimate.id})}">견적 삭제</a></div></section>
</main></html>
