<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout('현장 관리', ~{::main})}"
>
  <main>
    <div class="page-heading">
      <div>
        <p class="eyebrow">PRJ-01 · PROJECTS</p>
        <h1>현장 관리</h1>
        <p class="muted">공사 현황과 현장 정보를 한눈에 확인하세요.</p>
      </div>
      <a
        class="button"
        th:href="@{/projects/new}"
      >
        ＋ 현장 등록
      </a>
    </div>
    <section class="panel">
      <form
        class="search-bar"
        th:action="@{/projects}"
        method="get"
      >
        <label
          class="sr-only"
          for="keyword"
        >
          현장 검색
        </label>
        <input
          id="keyword"
          name="keyword"
          th:value="${keyword}"
          placeholder="현장명 또는 주소"
        />
        <label
          class="sr-only"
          for="status"
        >
          업무 상태
        </label>
        <select
          name="status"
          id="status"
        >
          <option value="">전체 상태</option>
          <option
            th:each="s : ${statuses}"
            th:value="${s}"
            th:selected="${s == selectedStatus}"
            th:text="${#messages.msg('project.status.' + s)}"
          ></option>
        </select>
        <button
          class="button"
          type="submit"
        >
          검색
        </button>
        <a
          class="button secondary"
          th:href="@{/projects}"
        >
          초기화
        </a>
      </form>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>현장명 / 주소</th>
              <th>상태</th>
              <th>공사 종류</th>
              <th>희망 시공일</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="project : ${projects.content}">
              <td>
                <a
                  th:href="@{/projects/{id}(id=${project.id})}"
                  th:text="${project.name}"
                ></a>
                <small
                  class="muted block"
                  th:text="${project.address}"
                ></small>
              </td>
              <td>
                <span
                  class="badge"
                  th:text="${project.statusLabel}"
                ></span>
              </td>
              <td th:text="${project.constructionType}"></td>
              <td th:text="${project.desiredStartDate ?: '미정'}"></td>
            </tr>
          </tbody>
        </table>
      </div>
      <div
        class="empty-state"
        th:if="${projects.empty}"
      >
        <h2>조건에 맞는 현장이 없습니다</h2>
        <p>현장을 등록하거나 검색 조건을 초기화해 주세요.</p>
      </div>
      <div class="pagination">
        <span th:text="'총 ' + ${projects.totalElements} + '건 · ' + (${projects.number}+1) + '페이지'"></span>
        <div>
          <a
            th:if="${projects.hasPrevious()}"
            th:href="@{/projects(keyword=${keyword},status=${selectedStatus},page=${projects.number-1})}"
          >
            이전
          </a>
          <a
            th:if="${projects.hasNext()}"
            th:href="@{/projects(keyword=${keyword},status=${selectedStatus},page=${projects.number+1})}"
          >
            다음
          </a>
        </div>
      </div>
    </section>
  </main>
</html>
