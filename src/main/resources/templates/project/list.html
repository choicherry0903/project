<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('고객·현장 목록')}"></head>
<body>
<a class="skip-link" href="#main">본문으로 이동</a>
<div class="app-shell">
  <aside th:replace="~{layout/base :: sidebar('list')}"></aside>
  <main id="main" class="main-content">
    <header class="page-header"><div><p class="eyebrow">고객과 현장을 한곳에서</p><h1>고객·현장 목록</h1><p class="description">현장별 고객 정보와 진행 상태, 다음 할 일을 확인합니다.</p></div><button class="button primary" type="button" disabled>고객·현장 등록</button></header>
    <div th:replace="~{layout/base :: notice}"></div>
    <section class="panel" aria-labelledby="list-title">
      <div class="panel-heading"><h2 id="list-title">전체 현장</h2><span class="badge">등록 전</span></div>
      <div class="filter-bar">
        <div class="field search-field"><label for="query">고객·현장 검색</label><input id="query" type="search" placeholder="고객명 또는 현장명" disabled></div>
        <div class="field"><label for="status">진행 상태</label><select id="status" disabled><option>전체 상태</option><option>상담</option><option>현장 확인</option><option>견적</option><option>계약</option><option>시공</option><option>완료·AS</option></select></div>
        <button class="button" type="button" disabled>검색</button>
      </div>
      <div class="table-scroll"><table><caption class="sr-only">고객·현장 목록: 아직 데이터가 연결되지 않았습니다.</caption><thead><tr><th scope="col">현장명</th><th scope="col">고객</th><th scope="col">담당자</th><th scope="col">진행 상태</th><th scope="col">다음 할 일</th></tr></thead><tbody><tr><td colspan="5"><div class="empty-state"><span class="empty-icon" aria-hidden="true">＋</span><h3>현장 정보를 모을 공간입니다</h3><p>고객·현장 등록 기능이 연결되면 이곳에 목록이 표시됩니다.</p><a class="text-link" th:href="@{/projects/detail}">현장 상세 화면 보기 →</a></div></td></tr></tbody></table></div>
    </section>
  </main>
</div>
</body>
</html>
