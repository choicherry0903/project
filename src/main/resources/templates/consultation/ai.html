<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('AI 상담 정리')}"></head>
<body>
<a class="skip-link" href="#main">본문으로 이동</a>
<div class="app-shell">
  <aside th:replace="~{layout/base :: sidebar('ai')}"></aside>
  <main id="main" class="main-content">
    <header class="page-header"><div><p class="eyebrow">대화에서 업무 기록으로</p><h1>AI 상담 정리</h1><p class="description">상담 내용을 정리하고, 직원이 확인한 뒤 현장 기록으로 남기는 화면입니다.</p></div><span class="badge">AI 연결 전</span></header>
    <div th:replace="~{layout/base :: notice}"></div>
    <section class="panel" aria-labelledby="target-title"><div class="panel-heading"><h2 id="target-title">연결할 현장</h2></div><div class="panel-body field"><label for="project">고객·현장 선택</label><select id="project" disabled><option>현장 데이터 연결 후 선택할 수 있습니다</option></select></div></section>
    <div class="consultation-grid">
      <section class="panel" aria-labelledby="source-title"><div class="panel-heading"><h2 id="source-title"><span class="step">01</span>상담 원문</h2></div><div class="panel-body"><div class="field"><label for="source">카카오톡·문자 상담 내용</label><textarea id="source" rows="14" placeholder="상담 내용을 입력할 자리입니다." disabled aria-describedby="source-help"></textarea><p id="source-help" class="help">원문 입력과 AI 정리 기능은 이후 연결합니다.</p></div><button class="button primary full-width" type="button" disabled>AI로 상담 정리</button></div></section>
      <section class="panel" aria-labelledby="result-title"><div class="panel-heading"><h2 id="result-title"><span class="step">02</span>정리 초안 확인</h2><span class="badge">결과 대기</span></div><div class="panel-body result-fields"><div class="field"><label for="scope">공사 범위</label><input id="scope" placeholder="정리 결과가 표시될 자리" disabled></div><div class="field"><label for="budget">예산</label><input id="budget" placeholder="금액·단위 확인" disabled></div><div class="field"><label for="date">희망 일정</label><input id="date" placeholder="정확한 날짜 확인" disabled></div><div class="field"><label for="requests">고객 요청 사항</label><textarea id="requests" rows="3" placeholder="색상·자재·기타 요청" disabled></textarea></div><div class="field"><label for="questions">추가 확인 사항</label><textarea id="questions" rows="3" placeholder="누락되거나 불명확한 정보" disabled></textarea></div><p class="help">정리 초안은 직원이 원문과 대조하고 수정한 뒤 저장하는 흐름으로 준비합니다.</p><button class="button primary full-width" type="button" disabled>확인 후 상담 기록 저장</button></div></section>
    </div>
  </main>
</div>
</body>
</html>
