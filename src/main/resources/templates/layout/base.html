<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | 지붕과벽 CMS'">지붕과벽 CMS</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<aside class="sidebar" th:fragment="sidebar(active)">
  <a class="brand" th:href="@{/customers}"><span class="brand-mark" aria-hidden="true">집</span><span>지붕과벽<small>업무 관리</small></span></a>
  <p class="nav-label">WORKSPACE</p>
  <nav aria-label="주요 메뉴">
    <a th:href="@{/customers}" th:classappend="${active == 'list'} ? 'active'" th:attr="aria-current=${active == 'list' ? 'page' : null}"><span class="nav-number">01</span>고객</a>
    <a th:href="@{/customers/detail}" th:classappend="${active == 'detail'} ? 'active'" th:attr="aria-current=${active == 'detail' ? 'page' : null}"><span class="nav-number">02</span>고객 상세</a>
    <a th:href="@{/aicounsult}" th:classappend="${active == 'ai'} ? 'active'" th:attr="aria-current=${active == 'ai' ? 'page' : null}"><span class="nav-number">03</span>AI 상담 정리</a>
  </nav>
  <div class="session-tools">
    <p><strong th:text="${currentStaff.displayName}">직원</strong>님</p>
    <form th:action="@{/logout}" method="post"><button class="button compact" type="submit">로그아웃</button></form>
  </div>
  <div class="sidebar-note"><span class="status-dot"></span>초기 화면 구성<small>업무 흐름을 확인하는 단계입니다.</small></div>
</aside>
<div class="notice" th:fragment="notice"><strong>화면 준비 중</strong><span>입력 항목과 화면 구성을 확인할 수 있습니다. 조회·저장·AI 정리 기능은 아직 제공하지 않습니다.</span></div>
</body>
</html>
