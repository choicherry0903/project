<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout('공간별 실측', ~{::main})}">
  <main>
    <div class="page-heading">
      <div>
        <p class="eyebrow">SUR-01 · SURVEY</p>
        <h1 th:text="${measurementId == null ? '공간 실측 등록' : '공간 실측 수정'}"></h1>
        <p class="muted" th:text="${project.name}"></p>
      </div>
      <a class="button secondary" th:href="@{/projects/{id}/survey(id=${project.id})}">실측 목록</a>
    </div>
    <form class="panel edit-form" data-dirty-check method="post" th:object="${form}"
      th:action="${measurementId == null} ? @{/projects/{id}/survey(id=${project.id})} : @{/projects/{id}/survey/{measurementId}(id=${project.id},measurementId=${measurementId})}">
      <div class="notice error" role="alert" tabindex="-1" th:if="${#fields.hasAnyErrors()}">
        <p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p>
      </div>
      <p class="muted">둘레와 높이를 입력하면 저장할 때 벽 면적을 계산합니다. 개구부 면적은 벽 면적에서 제외합니다.</p>
      <div class="form-grid">
        <div>
          <label for="roomName">공간 이름 *</label>
          <input id="roomName" th:field="*{roomName}" required maxlength="100" placeholder="예: 거실, 안방, 주방" />
        </div>
        <div>
          <label for="perimeter">벽 둘레 (m) *</label>
          <input id="perimeter" type="number" th:field="*{perimeter}" required min="0.01" max="999999.99" step="0.01" placeholder="0.00" />
        </div>
        <div>
          <label for="height">벽 높이 (m) *</label>
          <input id="height" type="number" th:field="*{height}" required min="0.01" max="999999.99" step="0.01" placeholder="0.00" />
        </div>
        <div>
          <label for="openingArea">문·창문 등 개구부 면적 (㎡) *</label>
          <input id="openingArea" type="number" th:field="*{openingArea}" required min="0" max="999999.99" step="0.01" />
        </div>
        <div>
          <label for="ceilingArea">천장 면적 (㎡) *</label>
          <input id="ceilingArea" type="number" th:field="*{ceilingArea}" required min="0" max="999999.99" step="0.01" />
        </div>
        <div>
          <label class="checkbox" for="includeCeiling">
            <input id="includeCeiling" type="checkbox" th:field="*{includeCeiling}" />
            작업 면적에 천장 포함
          </label>
          <small class="muted">체크하지 않아도 입력한 천장 면적은 기록에 보존됩니다.</small>
        </div>
      </div>
      <label for="surfaceCondition">표면 상태·현장 메모</label>
      <textarea id="surfaceCondition" th:field="*{surfaceCondition}" rows="4" maxlength="1000"
        placeholder="곰팡이, 균열, 기존 마감재 등 시공에 필요한 내용을 적어 주세요."></textarea>
      <p class="muted" th:if="${measurementId != null}">수정한 내용은 새 버전으로 저장되며 이전 기록도 볼 수 있습니다.</p>
      <div class="form-actions">
        <a class="button secondary" th:href="@{/projects/{id}/survey(id=${project.id})}">취소</a>
        <button class="button" type="submit">실측 저장</button>
      </div>
    </form>
  </main>
</html>
