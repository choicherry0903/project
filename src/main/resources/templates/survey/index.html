<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout('공간별 실측', ~{::main})}">
  <main>
    <div class="page-heading">
      <div>
        <p class="eyebrow">SUR-01 · SURVEY</p>
        <h1>공간별 실측</h1>
        <p class="muted" th:text="${project.name}"></p>
      </div>
      <a class="button" th:href="@{/projects/{id}/survey/new(id=${project.id})}">＋ 공간 추가</a>
    </div>
    <div class="notice success" th:if="${success}" th:text="${success}"></div>
    <div class="notice">벽 면적 = 둘레 × 높이 − 개구부 면적. 작업 면적은 천장을 포함하도록 선택한 공간에만 천장 면적을 더합니다.</div>
    <section class="panel" th:if="${rooms.empty}">
      <div class="empty-state">
        <div class="empty-icon">＋</div>
        <h2>등록된 실측 공간이 없습니다</h2>
        <p>첫 공간의 치수를 입력해 현장 실측을 시작하세요.</p>
        <a class="button" th:href="@{/projects/{id}/survey/new(id=${project.id})}">첫 공간 등록</a>
      </div>
    </section>
    <section class="panel" th:unless="${rooms.empty}">
      <h2>공간별 최신 기록</h2>
      <div class="table-scroll">
        <table>
          <thead><tr><th>공간</th><th>치수 (m)</th><th>개구부 (㎡)</th><th>벽 면적 (㎡)</th><th>천장 (㎡)</th><th>작업 면적 (㎡)</th><th>버전</th><th>관리</th></tr></thead>
          <tbody>
            <tr th:each="room : ${rooms}">
              <td th:text="${room.measurement.roomName}"></td>
              <td th:text="|${room.measurement.perimeter} × ${room.measurement.height}|"></td>
              <td th:text="${room.measurement.openingArea}"></td>
              <td th:text="${room.wallArea}"></td>
              <td th:text="${room.measurement.includeCeiling ? room.measurement.ceilingArea : '제외'}"></td>
              <td><strong th:text="${room.totalArea}"></strong></td>
              <td th:text="|v${room.measurement.revision}|"></td>
              <td>
                <a th:href="@{/projects/{id}/survey/{measurementId}/edit(id=${project.id},measurementId=${room.measurement.id})}">수정</a>
                <span aria-hidden="true"> · </span>
                <a th:href="@{/projects/{id}/survey/{measurementId}/history(id=${project.id},measurementId=${room.measurement.id})}">이력</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
    <div class="form-actions">
      <a class="button secondary" th:href="@{/projects/{id}(id=${project.id})}">현장 상세로</a>
    </div>
  </main>
</html>
