<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout('고객·상담', ~{::main})}"
>
  <main>
    <div class="page-heading">
      <div>
        <p class="eyebrow">CUS-01 · CUSTOMERS</p>
        <h1>고객·상담</h1>
        <p class="muted">고객 정보와 연결된 현장을 확인하세요.</p>
      </div>
      <a
        class="button"
        th:href="@{/customers/new}"
      >
        ＋ 고객 등록
      </a>
    </div>
    <section class="panel">
      <form
        class="search-bar"
        th:action="@{/customers}"
        method="get"
      >
        <label
          class="sr-only"
          for="keyword"
        >
          고객 검색
        </label>
        <input
          id="keyword"
          name="keyword"
          th:value="${keyword}"
          placeholder="고객명 또는 연락처 뒷자리"
        />
        <button
          class="button"
          type="submit"
        >
          검색
        </button>
        <a
          class="button secondary"
          th:href="@{/customers}"
        >
          초기화
        </a>
      </form>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>고객명</th>
              <th>연락처</th>
              <th>유입 경로</th>
              <th>상세</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="customer : ${customers.content}">
              <td th:text="${customer.name}"></td>
              <td th:text="${customer.maskedPhone}"></td>
              <td th:text="${customer.source ?: '—'}"></td>
              <td><a th:href="@{/customers/{id}(id=${customer.id})}">상세 보기 →</a></td>
            </tr>
          </tbody>
        </table>
      </div>
      <div
        class="empty-state"
        th:if="${customers.empty}"
      >
        <h2>조건에 맞는 고객이 없습니다</h2>
        <p>검색 조건을 변경하거나 첫 고객을 등록해 주세요.</p>
      </div>
      <div class="pagination">
        <span th:text="'총 ' + ${customers.totalElements} + '명 · ' + (${customers.number}+1) + '페이지'"></span>
        <div>
          <a
            th:if="${customers.hasPrevious()}"
            th:href="@{/customers(keyword=${keyword},page=${customers.number-1})}"
          >
            이전
          </a>
          <a
            th:if="${customers.hasNext()}"
            th:href="@{/customers(keyword=${keyword},page=${customers.number+1})}"
          >
            다음
          </a>
        </div>
      </div>
    </section>
  </main>
</html>
