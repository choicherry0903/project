<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('고객 상세')}"></head>
<body>
<a class="skip-link" href="#main">본문으로 이동</a>
<div class="app-shell">
  <aside th:replace="~{layout/base :: sidebar('detail')}"></aside>
  <main id="main" class="main-content">
    <header class="page-header">
      <div><p class="eyebrow"><a th:href="@{/customers}">고객</a> &gt; 상세</p><h1>고객 상세</h1><p class="description">등록한 고객·현장 정보와 상담 내용을 확인합니다.</p></div>
      <a class="button" th:href="@{/customers}">목록으로</a>
    </header>
    <div class="notice" th:unless="${selected}"><span>고객 목록에서 현장명을 선택하면 상세 정보를 확인할 수 있습니다.</span></div>
    <div class="empty-state" th:unless="${selected}">
      <h2>조회할 현장을 선택해 주세요</h2><p>등록된 고객과 현장, 상담 내용이 여기에 표시됩니다.</p>
      <a class="button primary" th:href="@{/customers}">고객 목록 보기</a>
    </div>
    <div id="customer-detail-fields" th:if="${selected}" th:object="${form}">
      <div class="notice"><span>고객·현장 정보와 상담 내용을 수정하거나 고객을 삭제할 수 있습니다.</span></div>
      <section class="panel" aria-labelledby="customer-title">
        <div class="panel-heading"><h2 id="customer-title">고객 정보</h2><span class="badge">상세 조회</span></div>
        <div class="panel-body form-grid">
          <div class="field"><label for="customerName">고객명</label><input id="customerName" name="customerName" th:value="*{customerName}" autocomplete="name" maxlength="50" readonly></div>
          <div class="field"><label for="customerPhone">연락처</label><input id="customerPhone" name="customerPhone" th:value="*{customerPhone}" type="tel" autocomplete="tel" maxlength="15" readonly></div>
        </div>
      </section>
      <section class="panel" aria-labelledby="project-title">
        <div class="panel-heading"><h2 id="project-title">현장 정보</h2></div>
        <div class="panel-body form-grid">
          <div class="field"><label for="projectName">현장명</label><input id="projectName" name="projectName" th:value="*{projectName}" maxlength="100" readonly></div>
          <div class="field"><label for="status">진행 상태</label><input id="status" name="status" th:value="${form.statusLabel()}" readonly></div>
          <div class="field full-row"><label for="siteAddress">현장 주소</label><input id="siteAddress" name="siteAddress" th:value="*{siteAddress}" autocomplete="street-address" readonly></div>
        </div>
      </section>
      <section class="panel" aria-labelledby="consultation-title">
        <div class="panel-heading"><h2 id="consultation-title">상담 내용</h2><span class="badge" th:text="|${#lists.size(form.consultationItems)}건|">0건</span></div>
        <div class="panel-body">
          <p class="help" th:if="${#lists.isEmpty(form.consultationItems)}">등록된 상담 내용이 없습니다.</p>
          <div class="consultation-rows">
            <div class="consultation-row consultation-detail-row" th:each="item, row : *{consultationItems}">
              <div class="field">
                <label th:for="|consultation-category-${row.index}|">상담 항목</label>
                <input th:id="|consultation-category-${row.index}|" th:name="|consultationItems[${row.index}].category|" th:value="${item.category}" readonly>
                <div class="field consultation-other" th:if="${item.category == '기타'}">
                  <label th:for="|consultation-other-${row.index}|">기타 항목명</label>
                  <input th:id="|consultation-other-${row.index}|" th:name="|consultationItems[${row.index}].customCategory|" th:value="${item.customCategory}" maxlength="100" readonly>
                </div>
              </div>
              <div class="field">
                <label th:for="|consultation-content-${row.index}|">상담 내용</label>
                <textarea th:id="|consultation-content-${row.index}|" th:name="|consultationItems[${row.index}].content|" th:text="${item.content}" rows="3" maxlength="2000" readonly></textarea>
              </div>
            </div>
          </div>
        </div>
      </section>
      <div class="form-actions"><a class="button primary" th:href="@{/customers/{id}/edit(id=${form.id})}">수정</a><a class="button" th:href="@{/customers/{id}/delete(id=${form.id})}">삭제</a><a class="button" th:href="@{/customers}">목록으로</a></div>
    </div>
  </main>
</div>
</body>
</html>
