<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('고객 상세', ~{::main})}"><main>
<div class="page-heading"><div><p class="eyebrow">CUS-03 · CUSTOMER</p><h1 th:text="${customer.name} + ' 고객'"></h1><p class="muted" th:text="${customer.phone}"></p></div><a class="button secondary" th:href="@{/customers/{id}/edit(id=${customer.id})}">정보 수정</a></div>
<section class="panel"><h2>고객 정보</h2><dl class="details"><dt>유입 경로</dt><dd th:text="${customer.source ?: '미등록'}"></dd><dt>상담 메모</dt><dd class="preserve-lines" th:text="${customer.memo ?: '등록된 메모가 없습니다.'}"></dd></dl><p class="muted">상담별 작성자·수정 이력은 후속 개발 예정입니다.</p></section>
<section class="panel"><div class="section-heading"><h2>연결된 현장</h2><a class="button" th:href="@{/projects/new(customerId=${customer.id})}">＋ 현장 생성</a></div><p class="empty-state" th:if="${#lists.isEmpty(projects)}">아직 연결된 현장이 없습니다.</p><table th:unless="${#lists.isEmpty(projects)}"><thead><tr><th>현장</th><th>상태</th><th>희망 시공일</th></tr></thead><tbody><tr th:each="project : ${projects}"><td><a th:href="@{/projects/{id}(id=${project.id})}" th:text="${project.name}"></a></td><td th:text="${project.statusLabel}"></td><td th:text="${project.desiredStartDate ?: '미정'}"></td></tr></tbody></table></section>
</main></html>
