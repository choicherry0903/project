<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>로그인 | 바른시공</title>
    <link
      rel="stylesheet"
      th:href="@{/css/app.css}"
    />
  </head>
  <body class="login-page">
    <main class="login-card">
      <span class="brand-mark">바</span>
      <p class="eyebrow">INTERIOR WORKSPACE</p>
      <h1 th:text="${companyName}">설기 시공</h1>
      <p class="muted">상담부터 시공 완료까지, 한곳에서 관리하세요.</p>
      <div
        class="notice error"
        th:if="${param.error}"
        role="alert"
      >
        로그인 정보를 확인해 주세요.
      </div>
      <div
        class="notice"
        th:if="${param.expired}"
      >
        다시 로그인해 주세요.
      </div>
      <div
        class="notice success"
        th:if="${param.logout}"
      >
        로그아웃했습니다.
      </div>
      <form
        id="login-form"
        th:action="@{/login}"
        method="post"
      >
        <label for="username">아이디 *</label>
        <input
          id="username"
          name="username"
          type="text"
          required
          autocomplete="username"
          placeholder="아이디를 입력해 주세요"
          autofocus
        />
        <label for="password">비밀번호 *</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          autocomplete="current-password"
          placeholder="비밀번호를 입력해 주세요"
        />
        <button
          class="button full-width"
          type="submit"
        >
          로그인
        </button>
      </form>
      <div class="auth-actions" aria-label="계정 관리">
        <button type="button" data-open-panel="register">회원가입</button>
        <button type="button" data-open-panel="find-username">아이디 찾기</button>
        <button type="button" disabled title="추후 지원 예정">비밀번호 재설정 요청</button>
      </div>

      <section class="auth-panel" id="register-panel" hidden>
        <h2>회원가입</h2>
        <form th:action="@{/auth/register}" method="post" data-auth-form="register">
          <label for="register-name">이름 *</label>
          <input id="register-name" name="name" required minlength="2" maxlength="50" autocomplete="name" />
          <label for="register-phone">전화번호 *</label>
          <input id="register-phone" name="phone" type="tel" required autocomplete="tel" placeholder="010-1234-5678" />
          <label for="register-email">이메일 *</label>
          <input id="register-email" name="email" type="email" required maxlength="254" autocomplete="email" placeholder="인증 메일을 받을 주소" />
          <p class="auth-feedback">인증 메일의 링크를 확인해야 로그인할 수 있습니다.</p>
          <label for="register-username">아이디 *</label>
          <div class="auth-inline">
            <input id="register-username" name="username" required minlength="4" maxlength="254" autocomplete="username" />
            <button class="button secondary" id="check-username" type="button" th:data-check-url="@{/auth/check-username}">중복확인</button>
          </div>
          <p class="auth-feedback" id="username-feedback" role="status"></p>
          <label for="register-password">비밀번호 *</label>
          <input id="register-password" name="password" type="password" required minlength="4" maxlength="72" autocomplete="new-password" />
          <button class="button full-width" type="submit">가입하기</button>
        </form>
        <form th:action="@{/auth/resend-verification}" method="post" data-auth-form="resend-verification" class="auth-resend">
          <label for="resend-email">인증 메일이 오지 않았나요?</label>
          <input id="resend-email" name="email" type="email" required autocomplete="email" placeholder="가입한 이메일 주소" />
          <button class="button secondary full-width" type="submit">인증 메일 재발송</button>
        </form>
      </section>

      <section class="auth-panel" id="find-username-panel" hidden>
        <h2>아이디 찾기</h2>
        <form th:action="@{/auth/find-username}" method="post" data-auth-form="find-username">
          <label for="find-name">이름 *</label>
          <input id="find-name" name="name" required autocomplete="name" />
          <label for="find-phone">전화번호 *</label>
          <input id="find-phone" name="phone" type="tel" required autocomplete="tel" />
          <button class="button full-width" type="submit">찾기</button>
        </form>
      </section>

    </main>
    <script th:src="@{/js/auth.js}" defer></script>
  </body>
</html>
