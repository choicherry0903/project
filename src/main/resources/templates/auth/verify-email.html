<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>이메일 확인 | 지붕과벽</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
  </head>
  <body class="login-page">
    <main class="login-card">
      <span class="brand-mark">지</span>
      <h1>이메일 확인</h1>
      <div class="notice success" th:if="${success}">이메일 확인이 완료되었습니다. 로그인해 주세요.</div>
      <div class="notice error" th:if="${error}" th:text="${error}">인증 링크를 확인해 주세요.</div>
      <div class="notice error" th:if="${valid == false}">인증 링크가 만료되었거나 이미 사용되었습니다.</div>
      <form th:if="${valid}" th:action="@{/auth/verify-email}" method="post">
        <input type="hidden" name="token" th:value="${token}" />
        <p>이메일 주소를 확인하고 회원가입을 완료합니다.</p>
        <button class="button full-width" type="submit">이메일 확인</button>
      </form>
      <a class="button secondary full-width" th:href="@{/login}">로그인으로 돌아가기</a>
    </main>
  </body>
</html>
