spring:
  application:
    name: interior-cms
  profiles:
    default: supabase
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  thymeleaf:
    encoding: UTF-8
  mail:
    host: smtp.resend.com
    port: 587
    username: resend
    password: ${RESEND_API_KEY:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 200MB
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
app:
  company-id: 1
  company-name: 설기 시공
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  mail-from: ${MAIL_FROM:}
  zone-id: Asia/Seoul
  bootstrap:
    username: ${ADMIN_USERNAME:${ADMIN_EMAIL:}}
    password: ${ADMIN_PASSWORD:}
